<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedScribe — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-bg">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon">⚕</span>
        <h1>MedScribe</h1>
        <p>Reset your password</p>
      </div>
      <div id="reset-form">
        <h2>Set New Password</h2>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="reset-password" placeholder="Min. 8 characters">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="reset-confirm" placeholder="Repeat password">
        </div>
        <div class="form-error" id="reset-error"></div>
        <div class="form-success" id="reset-success"></div>
        <button class="btn btn-primary btn-full" onclick="doReset()">Reset Password</button>
        <div class="auth-links"><a href="/">Back to sign in</a></div>
      </div>
    </div>
  </div>
  <script>
    async function doReset() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const pw = document.getElementById('reset-password').value;
      const conf = document.getElementById('reset-confirm').value;
      const errEl = document.getElementById('reset-error');
      const sucEl = document.getElementById('reset-success');
      errEl.textContent = '';
      if (!token) { errEl.textContent = 'Invalid reset link.'; return; }
      if (pw.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; return; }
      if (pw !== conf) { errEl.textContent = 'Passwords do not match.'; return; }
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ token, password: pw })
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error; return; }
      sucEl.textContent = 'Password reset! Redirecting to login...';
      setTimeout(() => window.location.href = '/', 2000);
    }
  </script>
</body>
</html>
